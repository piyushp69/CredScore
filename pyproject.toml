[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "credscore"
version = "2.0.0"
description = "Explainable credit default risk scoring on the Home Credit dataset: pipeline, REST API and React dashboard."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15",
    "scikit-learn>=1.4",
    "xgboost>=2.1",
    "pydantic>=2.6",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
download = ["kagglehub>=0.3"]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["credscore*", "backend*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
filterwarnings = ["error::DeprecationWarning:credscore.*"]
